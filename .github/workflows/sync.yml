name: Update Mirsa source
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirsa-source
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Mirror latest published setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync.py
